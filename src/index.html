<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BackupTool</title>
  </head>
  <body>
    <main>
      <header>
        <h1>BackupTool</h1>
      </header>

      <section>
        <h2>Backup</h2>
        <label>
          Source directories
          <span class="path-row">
            <div id="source-list" class="source-list"></div>
            <button id="add-source" type="button" class="browse-button">Add</button>
          </span>
        </label>
        <label>
          Repository directory
          <span class="path-row">
            <input id="backup-destination" type="text" autocomplete="off" />
            <button type="button" class="browse-button" data-target="backup-destination">
              Browse
            </button>
          </span>
        </label>
        <label>
          Compression algorithm
          <select id="compression-algorithm">
            <option value="none" selected>None</option>
            <option value="zstd">zstd</option>
          </select>
        </label>
        <div class="actions">
          <button id="start-backup" type="button">Start Backup</button>
        </div>
      </section>

      <section>
        <h2>Filters</h2>
        <div class="grid">
          <label>
            Include path contains
            <input id="include-path" type="text" autocomplete="off" />
          </label>
          <label>
            Exclude path contains
            <input id="exclude-path" type="text" autocomplete="off" />
          </label>
          <label>
            Extensions
            <input id="extensions" type="text" autocomplete="off" placeholder="txt;png" />
          </label>
          <label>
            Include file name contains
            <input id="include-name" type="text" autocomplete="off" />
          </label>
          <label>
            Exclude file name contains
            <input id="exclude-name" type="text" autocomplete="off" />
          </label>
          <label>
            Minimum size
            <input id="min-size" type="number" min="0" step="1" />
          </label>
          <label>
            Maximum size
            <input id="max-size" type="number" min="0" step="1" />
          </label>
          <label>
            Modified after
            <input id="modified-after" type="datetime-local" />
          </label>
          <label>
            Modified before
            <input id="modified-before" type="datetime-local" />
          </label>
        </div>
      </section>

      <section>
        <h2>Restore</h2>
        <div class="repository-row">
          <span id="current-repository">No repository opened</span>
          <button id="open-repository" type="button" class="browse-button">Open Repository</button>
        </div>
        <label>
          Available snapshots
          <select id="snapshot-list">
            <option value="">Open a repository first</option>
          </select>
        </label>
        <label>
          Restore path strategy
          <select id="restore-path-strategy">
            <option value="preserveRelativePath" selected>Preserve Relative Path</option>
            <option value="preserveFullPath">Preserve Full Path</option>
            <option value="flatten">Flatten</option>
          </select>
        </label>
        <label id="flatten-conflict-row">
          Flatten conflict strategy
          <select id="flatten-conflict-strategy">
            <option value="rename" selected>Rename</option>
            <option value="error">Error</option>
            <option value="skip">Skip</option>
            <option value="overwrite">Overwrite</option>
          </select>
        </label>
        <label>
          Restore directory
          <span class="path-row">
            <input id="restore-destination" type="text" autocomplete="off" />
            <button type="button" class="browse-button" data-target="restore-destination">
              Browse
            </button>
          </span>
        </label>
        <div class="actions">
          <button id="start-restore" type="button">Start Restore</button>
        </div>
      </section>

      <section>
        <h2>Repository Archive</h2>
        <label>
          Archive algorithm
          <select id="archive-algorithm">
            <option value="tar" selected>tar</option>
          </select>
        </label>
        <label>
          Export repository
          <span class="path-row">
            <input id="archive-export-repository" type="text" autocomplete="off" />
            <button type="button" class="browse-button" data-target="archive-export-repository">
              Browse
            </button>
          </span>
        </label>
        <label>
          Export file
          <span class="path-row">
            <input id="archive-export-file" type="text" autocomplete="off" />
            <button id="choose-export-file" type="button" class="browse-button">Browse</button>
          </span>
        </label>
        <div class="actions">
          <button id="export-repository" type="button">Export Repository</button>
        </div>
        <label>
          Import archive file
          <span class="path-row">
            <input id="archive-import-file" type="text" autocomplete="off" />
            <button id="choose-import-file" type="button" class="browse-button">Browse</button>
          </span>
        </label>
        <label>
          Import destination
          <span class="path-row">
            <input id="archive-import-destination" type="text" autocomplete="off" />
            <button type="button" class="browse-button" data-target="archive-import-destination">
              Browse
            </button>
          </span>
        </label>
        <div class="actions">
          <button id="import-repository" type="button">Import Repository</button>
        </div>
      </section>

      <p id="core-result" aria-live="polite"></p>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
