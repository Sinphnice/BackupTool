[package]
name = "backup-tool"
version = "0.1.0"
description = "BackupTool desktop application"
authors = ["BackupTool contributors"]
edition = "2021"

[lib]
name = "backup_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
backup-core = { path = "../crates/backup-core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
